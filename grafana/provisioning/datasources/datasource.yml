apiVersion: 1

datasources:
  - name: Staging Postgres
    uid: staging-postgres          # the dashboard JSON files refer to this uid
    type: grafana-postgresql-datasource
    access: proxy
    url: staging-db:5432           # service name inside the Docker network
    user: de
    database: staging
    isDefault: true
    editable: true
    jsonData:
      database: staging
      sslmode: disable
      postgresVersion: 1500
    secureJsonData:
      password: de
